<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="600" height="240" fill="#ffffff"/>
  <g stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
    <!-- permanent: one arm -->
    <circle cx="100" cy="55" r="20"/>
    <line x1="100" y1="75" x2="100" y2="140"/>
    <line x1="100" y1="90" x2="135" y2="120"/>
    <line x1="100" y1="140" x2="80" y2="185"/><line x1="100" y1="140" x2="120" y2="185"/>
    <!-- temporal: cast -->
    <circle cx="300" cy="55" r="20"/>
    <line x1="300" y1="75" x2="300" y2="140"/>
    <line x1="300" y1="90" x2="335" y2="120"/>
    <line x1="300" y1="90" x2="268" y2="118"/>
    <line x1="300" y1="140" x2="280" y2="185"/><line x1="300" y1="140" x2="320" y2="185"/>
    <!-- situational: baby -->
    <circle cx="500" cy="55" r="20"/>
    <line x1="500" y1="75" x2="500" y2="140"/>
    <line x1="500" y1="90" x2="535" y2="120"/>
    <line x1="500" y1="90" x2="470" y2="112"/>
    <line x1="500" y1="140" x2="480" y2="185"/><line x1="500" y1="140" x2="520" y2="185"/>
  </g>
  <rect x="262" y="100" width="22" height="30" rx="6" transform="rotate(-50 273 115)" fill="#f2f2f2" stroke="#1e64c8" stroke-width="4"/>
  <ellipse cx="465" cy="105" rx="20" ry="13" fill="#f6c89f" stroke="#333" stroke-width="3"/>
  <circle cx="450" cy="98" r="9" fill="#f6c89f" stroke="#333" stroke-width="3"/>
  <g font-size="18" text-anchor="middle" fill="#222">
    <text x="100" y="220" font-weight="bold">Permanent</text>
    <text x="300" y="220" font-weight="bold">Temporal</text>
    <text x="500" y="220" font-weight="bold">Situacional</text>
  </g>
</svg>
